<style>
:root{
    --pink:#ff6f9f;
    --pink-light:#ffd6e4;
    --pink-soft:#fff0f5;
    --pink-dark:#d94d7d;
    --white:#fff;
    --text:#442b35;
    --muted:#9b7885;
    --shadow:0 20px 60px rgba(210,91,130,.16);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    font-family:"DM Sans",sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 15% 15%,rgba(255,182,210,.35),transparent 30%),
        radial-gradient(circle at 85% 10%,rgba(255,213,226,.45),transparent 30%),
        linear-gradient(135deg,#fff8fb,#fff0f5 50%,#fff9fc);
    overflow-x:hidden;
}

button{
    font:inherit;
}

button,
canvas,
.card{
    -webkit-user-select:none;
    user-select:none;
}

button{
    border:0;
    cursor:pointer;
}

.page{
    width:min(1180px,calc(100% - 36px));
    margin:auto;
    padding:30px 0 70px;
    position:relative;
    z-index:2;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    height:50px;
    position:relative;
    z-index:50;
}

.menu-wrap{
    position:relative;
}

.menu-btn{
    width:48px;
    height:48px;
    border-radius:16px;
    background:rgba(255,255,255,.78);
    box-shadow:0 10px 30px rgba(190,75,115,.12);
    color:var(--pink-dark);
    font-size:22px;
    transition:.25s ease;
    backdrop-filter:blur(12px);
}

.menu-btn:hover{
    transform:translateY(-2px) rotate(2deg);
    box-shadow:0 14px 35px rgba(190,75,115,.18);
}

.menu-btn:active{
    transform:scale(.94);
}

.menu{
    position:absolute;
    right:0;
    top:58px;
    width:250px;
    padding:10px;
    border-radius:22px;
    background:rgba(255,255,255,.96);
    box-shadow:0 25px 70px rgba(173,65,105,.2);
    border:1px solid rgba(255,255,255,.9);
    backdrop-filter:blur(20px);
    opacity:0;
    transform:translateY(-8px) scale(.96);
    pointer-events:none;
    transition:.2s ease;
}

.menu.open{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
}

.menu-item{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 12px;
    border-radius:14px;
    background:transparent;
    color:var(--text);
    text-align:left;
    transition:.2s;
}

.menu-item:hover{
    background:var(--pink-soft);
}

.menu-label{
    display:flex;
    gap:10px;
    align-items:center;
    font-size:14px;
}

.toggle{
    width:40px;
    height:23px;
    border-radius:20px;
    background:#eadde2;
    padding:3px;
    transition:.25s;
}

.toggle span{
    display:block;
    width:17px;
    height:17px;
    border-radius:50%;
    background:white;
    box-shadow:0 2px 5px rgba(0,0,0,.12);
    transition:.25s;
}

.toggle.active{
    background:var(--pink);
}

.toggle.active span{
    transform:translateX(17px);
}

.menu-divider{
    height:1px;
    background:#f2e4e9;
    margin:6px 4px;
}

/* =========================
   HERO
========================= */

.hero{
    text-align:center;
    max-width:760px;
    margin:30px auto 45px;
}

.eyebrow{
    color:var(--pink-dark);
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:3px;
    margin-bottom:13px;
}

h1{
    margin:0;
    font-family:"Playfair Display",serif;
    font-size:clamp(44px,7vw,78px);
    line-height:.95;
    font-weight:500;
    letter-spacing:-2px;
}

h1 em{
    color:var(--pink);
}

.hero-heart{
    display:inline-block;
    animation:heartFloat 2.7s ease-in-out infinite;
}

@keyframes heartFloat{
    0%,100%{transform:translateY(0) rotate(-4deg)}
    50%{transform:translateY(-7px) rotate(4deg)}
}

/* =========================
   CARDS
========================= */

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
    perspective:1400px;
}

.card{
    position:relative;
    min-height:410px;
    border-radius:30px;
    background:rgba(255,255,255,.78);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:var(--shadow);
    overflow:hidden;
    transform-style:preserve-3d;
    transition:
        transform .25s ease,
        box-shadow .25s ease;
    will-change:transform;
}

.card:hover{
    box-shadow:0 28px 75px rgba(210,91,130,.22);
}

.card-inner{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:35px;
    text-align:center;
    transform:translateZ(35px);
    pointer-events:none;
}

.card-number{
    position:absolute;
    top:22px;
    left:24px;
    font-size:12px;
    font-weight:700;
    color:#d99aae;
    letter-spacing:2px;
}

.card-icon{
    width:66px;
    height:66px;
    display:grid;
    place-items:center;
    border-radius:22px;
    background:var(--pink-soft);
    color:var(--pink);
    font-size:28px;
    margin-bottom:25px;
    box-shadow:inset 0 0 0 1px rgba(255,111,159,.08);
}

.message{
    font-family:"Playfair Display",serif;
    font-style:italic;
    font-size:22px;
    line-height:1.45;
    color:#53343f;
}

.fav-btn{
    pointer-events:auto;
    margin-top:25px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:#fff;
    color:#dca3b4;
    box-shadow:0 8px 20px rgba(150,70,100,.1);
    transition:.2s;
}

.fav-btn:hover{
    transform:scale(1.1);
}

.fav-btn.active{
    color:var(--pink);
    background:#fff0f5;
}

/* =========================
   SCRATCH CANVAS
========================= */

.scratch-layer{
    position:absolute;
    inset:0;

    /* FORCE THE SCRATCH SURFACE TO MATCH THE CARD */
    width:100%;
    height:100%;
    display:block;

    /* Match the card shape exactly */
    border-radius:inherit;

    z-index:10;
    cursor:crosshair;

    /* Prevent dragging / scrolling while scratching */
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;

    pointer-events:auto;
}

.scratch-layer.revealed{
    opacity:0;
    pointer-events:none;
    transition:opacity .45s ease;
}

.card.revealed .scratch-layer{
    opacity:0;
    pointer-events:none;
}

/* =========================
   BOTTOM CONTROLS
========================= */

.controls{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:30px;
}

.action{
    padding:13px 19px;
    border-radius:16px;
    background:#fff;
    color:var(--pink-dark);
    box-shadow:0 10px 25px rgba(190,75,115,.1);
    font-weight:600;
    transition:.2s;
}

.action:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 32px rgba(190,75,115,.16);
}

.action.primary{
    background:var(--pink);
    color:#fff;
}

.action:active{
    transform:scale(.96);
}

/* =========================
   FAVOURITES
========================= */

.favourites{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(77,37,50,.2);
    backdrop-filter:blur(8px);
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.favourites.open{
    opacity:1;
    pointer-events:auto;
}

.fav-panel{
    width:min(650px,100%);
    max-height:80vh;
    overflow:auto;
    background:#fff;
    border-radius:28px;
    padding:28px;
    box-shadow:0 30px 100px rgba(100,35,60,.25);
    transform:translateY(15px) scale(.97);
    transition:.25s;
}

.favourites.open .fav-panel{
    transform:translateY(0) scale(1);
}

.panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.panel-head h2{
    margin:0;
    font-family:"Playfair Display",serif;
    font-weight:500;
}

.close-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--pink-soft);
    color:var(--pink-dark);
}

.fav-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.fav-item{
    padding:16px;
    border-radius:17px;
    background:#fff7fa;
    font-family:"Playfair Display",serif;
    font-style:italic;
    line-height:1.4;
}

/* =========================
   PETALS
========================= */

.petals{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
}

.petal{
    position:absolute;
    top:-30px;
    width:12px;
    height:17px;
    border-radius:70% 30% 70% 30%;
    background:rgba(255,135,174,.35);
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translate3d(var(--x),110vh,0) rotate(720deg);
    }
}

/* =========================
   HEART BURST
========================= */

.burst-heart{
    position:fixed;
    pointer-events:none;
    z-index:200;
    font-size:18px;
    animation:burst 900ms ease-out forwards;
}

@keyframes burst{
    0%{
        opacity:1;
        transform:translate(-50%,-50%) scale(.5);
    }
    100%{
        opacity:0;
        transform:
            translate(
                calc(-50% + var(--bx)),
                calc(-50% + var(--by))
            )
            scale(1.35)
            rotate(var(--rot));
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){
    .cards{
        grid-template-columns:1fr;
        max-width:520px;
        margin:auto;
    }

    .card{
        min-height:360px;
    }

    .hero{
        margin-top:20px;
    }
}

@media(prefers-reduced-motion:reduce){
    *{
        scroll-behavior:auto!important;
    }
}

/* User setting */
body.reduce-motion *,
body.reduce-motion *::before,
body.reduce-motion *::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
}
</style>
</head>

const STORAGE_KEY = "loveLotteryState_v4";

let state = {
    favourites: [],
    sound: true,
    petals: true,
    reducedMotion: false,
    revealed: 0,
    usedMessages: []
};

function loadState(){

    try{

        const saved = JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        );

        if(saved){

            state = {
                ...state,
                ...saved
            };

        }

    }catch(e){

        console.warn("Could not load saved state.");

    }

    if(!Array.isArray(state.favourites)){
        state.favourites = [];
    }

    if(!Array.isArray(state.usedMessages)){
        state.usedMessages = [];
    }

}

function saveState(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );

}


/* =========================================================
   NON-REPEATING MESSAGE SYSTEM
========================================================= */

function getNewMessages(amount = 3){

    const picked = [];

    while(picked.length < amount){

        let unused = messages.filter(
            message => !state.usedMessages.includes(message)
        );

        /*
           Once every message has appeared, start
           a completely new cycle.
        */
        if(unused.length === 0){

            state.usedMessages = [];

            unused = [...messages];

        }

        const index =
            Math.floor(Math.random() * unused.length);

        const message = unused[index];

        picked.push(message);

        state.usedMessages.push(message);

    }

    saveState();

    return picked;

}

let audioContext = null;

function playSound(){

    if(!state.sound) return;

    try{

        if(!audioContext){

            audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
            620,
            audioContext.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            900,
            audioContext.currentTime + .12
        );

        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .06,
            audioContext.currentTime + .015
        );

        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime + .18
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(
            audioContext.currentTime + .2
        );

    }catch(e){}

}

/* =========================================================
   3D TILT
========================================================= */

function setupTilt(card){

    if(state.reducedMotion) return;

    let rect;

    function move(e){

        if(!rect){

            rect = card.getBoundingClientRect();

        }

        const x =
            e.clientX - rect.left;

        const y =
            e.clientY - rect.top;

        const rotateY =
            ((x / rect.width) - .5) * 10;

        const rotateX =
            ((y / rect.height) - .5) * -10;

        card.style.transform =
            `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(4px)`;

    }

    function leave(){

        rect = null;

        card.style.transform =
            "rotateX(0deg) rotateY(0deg) translateZ(0)";

    }

    card.addEventListener("pointermove", move);

    card.addEventListener("pointerleave", leave);

}


/* =========================================================
   SCRATCH CARD
========================================================= */

class ScratchCard{

    constructor(card, message){

        this.card = card;
        this.message = message;

        this.canvas =
            card.querySelector(".scratch-layer");

        this.ctx =
            this.canvas.getContext("2d", {
                willReadFrequently:true
            });

        this.isDown = false;
        this.lastX = 0;
        this.lastY = 0;
        this.revealed = false;

    requestAnimationFrame(() => {
    this.resize();
});

        /*
           Pointer events stop the image/page from
           being dragged while scratching.
        */
        this.canvas.addEventListener(
            "pointerdown",
            this.start.bind(this),
            {passive:false}
        );

        this.canvas.addEventListener(
            "pointermove",
            this.move.bind(this),
            {passive:false}
        );

        this.canvas.addEventListener(
            "pointerup",
            this.end.bind(this),
            {passive:false}
        );

        this.canvas.addEventListener(
            "pointercancel",
            this.end.bind(this),
            {passive:false}
        );

        window.addEventListener(
            "resize",
            () => this.resize()
        );

    }


    resize(){

        const rect =
            this.canvas.getBoundingClientRect();

        const dpr =
            Math.min(window.devicePixelRatio || 1,2);

        this.canvas.width =
            Math.round(rect.width * dpr);

        this.canvas.height =
            Math.round(rect.height * dpr);

        this.ctx.setTransform(
            dpr,0,0,dpr,0,0
        );

        if(!this.revealed){

            this.paint();

        }

    }


    paint(){

        const rect =
            this.canvas.getBoundingClientRect();

        const ctx = this.ctx;

        ctx.clearRect(
            0,
            0,
            rect.width,
            rect.height
        );

        /*
           Clean scratch surface.
        */

        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                rect.width,
                rect.height
            );

        gradient.addColorStop(
            0,
            "#ffc4d9"
        );

        gradient.addColorStop(
            .5,
            "#ffadc9"
        );

        gradient.addColorStop(
            1,
            "#ffbfd5"
        );

        ctx.fillStyle = gradient;

        ctx.fillRect(
            0,
            0,
            rect.width,
            rect.height
        );

        /*
           Subtle shine.
        */

        ctx.fillStyle =
            "rgba(255,255,255,.16)";

        for(let i=0;i<18;i++){

            const x =
                Math.random()*rect.width;

            const y =
                Math.random()*rect.height;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                1.5,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

        /*
           Center heart.
        */

        ctx.fillStyle =
            "rgba(255,255,255,.9)";

        ctx.font =
            "34px Arial";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            "♡",
            rect.width/2,
            rect.height/2 - 10
        );

        ctx.font =
            "600 12px DM Sans";

        ctx.fillText(
            "scratch me",
            rect.width/2,
            rect.height/2 + 24
        );

    }


    getPoint(e){

        const rect =
            this.canvas.getBoundingClientRect();

        return {

            x:e.clientX - rect.left,

            y:e.clientY - rect.top

        };

    }


    start(e){

        if(this.revealed) return;

        e.preventDefault();
        e.stopPropagation();

        this.isDown = true;

        /*
           THIS fixes the "catching/moving image" issue.
           The pointer becomes locked to this canvas.
        */
        try{

            this.canvas.setPointerCapture(
                e.pointerId
            );

        }catch(err){}

        const point =
            this.getPoint(e);

        this.lastX = point.x;
        this.lastY = point.y;

        this.scratch(
            point.x,
            point.y
        );

    }


    move(e){

        if(!this.isDown ||
           this.revealed) return;

        e.preventDefault();
        e.stopPropagation();

        const point =
            this.getPoint(e);

        const distance =
            Math.hypot(
                point.x - this.lastX,
                point.y - this.lastY
            );

        if(distance > 1){

            this.scratch(
                point.x,
                point.y
            );

            this.lastX = point.x;
            this.lastY = point.y;

        }

    }


    end(e){

        if(!this.isDown) return;

        e.preventDefault();
        e.stopPropagation();

        this.isDown = false;

        try{

            this.canvas.releasePointerCapture(
                e.pointerId
            );

        }catch(err){}

        this.checkProgress();

    }


    scratch(x,y){

        const ctx = this.ctx;

        ctx.save();

        ctx.globalCompositeOperation =
            "destination-out";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            25,
            0,
            Math.PI*2
        );

        ctx.fill();

        /*
           Make continuous scratching smooth.
        */

        if(this.lastX !== undefined){

            ctx.lineWidth = 50;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            ctx.beginPath();

            ctx.moveTo(
                this.lastX,
                this.lastY
            );

            ctx.lineTo(
                x,
                y
            );

            ctx.stroke();

        }

        ctx.restore();

    }


    checkProgress(){

        if(this.revealed) return;

        const rect =
            this.canvas.getBoundingClientRect();

        const sample =
            this.ctx.getImageData(
                0,
                0,
                this.canvas.width,
                this.canvas.height
            );

        let transparent = 0;

        /*
           Sample pixels rather than checking every pixel.
        */

        for(
            let i=3;
            i<sample.data.length;
            i+=40
        ){

            if(sample.data[i] < 80){

                transparent++;

            }

        }

        const total =
            sample.data.length / 40;

        const percent =
            transparent / total;

        if(percent > .48){

            this.reveal();

        }

    }


    reveal(){

        if(this.revealed) return;

        this.revealed = true;

        this.card.classList.add("revealed");

        this.canvas.classList.add("revealed");

        state.revealed++;

        saveState();

        playSound();

        const rect =
            this.card.getBoundingClientRect();

        heartBurst(
            rect.left + rect.width/2,
            rect.top + rect.height/2
        );

    }

}


/* =========================================================
   CREATE CARDS
========================================================= */

let activeCards = [];

function createCards(){

    activeCards = [];

    cardsEl.innerHTML = "";

    const selected =
        getNewMessages(3);

    selected.forEach(
        (message,index) => {

            const card =
                document.createElement("article");

            card.className = "card";

            card.innerHTML = `

                <div class="card-number">
                    0${index+1}
                </div>

                <div class="card-inner">

                    <div class="card-icon">
                        ♡
                    </div>

                    <div class="message">
                        ${escapeHTML(message)}
                    </div>

                    <button
                        class="fav-btn"
                        aria-label="Favourite"
                    >
                        ♡
                    </button>

                </div>

                <canvas
                    class="scratch-layer"
                ></canvas>

            `;

            cardsEl.appendChild(card);

            setupTilt(card);

            const fav =
                card.querySelector(".fav-btn");

            if(
                state.favourites.includes(message)
            ){

                fav.classList.add("active");
                fav.textContent = "♥";

            }

            fav.addEventListener(
                "click",
                e => {

                    e.preventDefault();
                    e.stopPropagation();

                    toggleFavourite(
                        message,
                        fav
                    );

                }
            );

            const scratch =
                new ScratchCard(
                    card,
                    message
                );

            activeCards.push(scratch);

        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(str){

    const div =
        document.createElement("div");

    div.textContent = str;

    return div.innerHTML;

}


/* =========================================================
   FAVOURITES
========================================================= */

function toggleFavourite(
    message,
    button
){

    const index =
        state.favourites.indexOf(message);

    if(index === -1){

        state.favourites.push(message);

        button.classList.add("active");

        button.textContent = "♥";

    }else{

        state.favourites.splice(
            index,
            1
        );

        button.classList.remove("active");

        button.textContent = "♡";

    }

    saveState();

    renderFavourites();

}


function renderFavourites(){

    favList.innerHTML = "";

    if(state.favourites.length === 0){

        const empty =
            document.createElement("div");

        empty.className = "fav-item";

        empty.textContent =
            "no favourites yet ♡";

        favList.appendChild(empty);

        return;

    }

    [...state.favourites]
        .reverse()
        .forEach(message => {

            const item =
                document.createElement("div");

            item.className = "fav-item";

            item.textContent =
                message;

            favList.appendChild(item);

        });

}


/* =========================================================
   FAVOURITES PANEL
========================================================= */

favouritesBtn.addEventListener(
    "click",
    () => {

        menu.classList.remove("open");

        renderFavourites();

        favourites.classList.add("open");

    }
);

closeFav.addEventListener(
    "click",
    () => {

        favourites.classList.remove("open");

    }
);

favourites.addEventListener(
    "click",
    e => {

        if(e.target === favourites){

            favourites.classList.remove("open");

        }

    }
);


/* =========================================================
   PETALS
========================================================= */

let petalInterval = null;

function makePetal(){

    if(!state.petals) return;

    const petal =
        document.createElement("div");

    petal.className = "petal";

    petal.style.left =
        `${Math.random()*100}%`;

    petal.style.setProperty(
        "--x",
        `${(Math.random()-.5)*240}px`
    );

    petal.style.animationDuration =
        `${5 + Math.random()*6}s`;

    petal.style.opacity =
        `${.2 + Math.random()*.35}`;

    petal.style.transform =
        `rotate(${Math.random()*180}deg)`;

    petalsEl.appendChild(petal);

    setTimeout(
        () => petal.remove(),
        12000
    );

}


function startPetals(){

    clearInterval(petalInterval);

    if(!state.petals) return;

    petalInterval =
        setInterval(
            makePetal,
            650
        );

}


function updatePetals(){

    petalsEl.innerHTML = "";

    if(state.petals){

        startPetals();

    }else{

        clearInterval(
            petalInterval
        );

    }

    petalSwitch.classList.toggle(
        "active",
        state.petals
    );

}


/* =========================================================
   SETTINGS
========================================================= */

function updateSettings(){

    petalSwitch.classList.toggle(
        "active",
        state.petals
    );

    soundSwitch.classList.toggle(
        "active",
        state.sound
    );

    motionSwitch.classList.toggle(
        "active",
        state.reducedMotion
    );

    document.body.classList.toggle(
        "reduce-motion",
        state.reducedMotion
    );

}


petalsToggle.addEventListener(
    "click",
    () => {

        state.petals =
            !state.petals;

        saveState();

        updateSettings();

        updatePetals();

    }
);


soundToggle.addEventListener(
    "click",
    () => {

        state.sound =
            !state.sound;

        saveState();

        updateSettings();

        if(state.sound){

            playSound();

        }

    }
);


motionToggle.addEventListener(
    "click",
    () => {

        state.reducedMotion =
            !state.reducedMotion;

        saveState();

        updateSettings();

        /*
           Rebuild tilt behaviour if motion changes.
        */

        createCards();

    }
);


/* =========================================================
   RESET
========================================================= */

resetBtn.addEventListener(
    "click",
    () => {

        state.usedMessages = [];
        state.revealed = 0;

        saveState();

        menu.classList.remove("open");

        createCards();

    }
);


/* =========================================================
   BUTTONS
========================================================= */

shuffleBtn.addEventListener(
    "click",
    () => {

        createCards();

    }
);


revealBtn.addEventListener(
    "click",
    () => {

        activeCards.forEach(
            scratch => {

                scratch.reveal();

            }
        );

    }
);


/* =========================================================
   PREVENT DRAGGING
   This is the other part that stops the page from
   "catching" the card/image while scratching.
========================================================= */

document.addEventListener(
    "dragstart",
    e => {

        if(
            e.target.closest(".card") ||
            e.target.closest(".scratch-layer")
        ){

            e.preventDefault();

        }

    }
);


/* =========================================================
   START
========================================================= */

loadState();

updateSettings();

updatePetals();

renderFavourites();

createCards();

</script>

</html>
